---
# Customer Site Deployment (React Router 8 SSR via Node.js)
#
# Serves the customer's public-facing website via server-side rendering.
# Content is code-defined in the site repo (no external CMS).
# Each customer has a unique Docker image built from their forked repo.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-site
  namespace: {{CUSTOMER_SLUG}}
  labels:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: customer-site
      customer: "{{CUSTOMER_ID}}"

  template:
    metadata:
      labels:
        app: customer-site
        customer: "{{CUSTOMER_ID}}"
    spec:
      containers:
        - name: customer-site
          image: registry.scaleweb.dk/customer-site-{{CUSTOMER_SLUG}}:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # SSR is bursty: the old 200m limit CFS-throttled ~30% of periods
              # even under light traffic, driving variable TTFB. 1 core gives PHP-free
              # Node SSR room to burst per request.
              cpu: 1000m
              # Node SSR baseline is ~115Mi; 128Mi left <10% headroom and paged
              # CustomerPodMemoryNearLimit (2026-07-10). Matches CRM stack templates (CRM#433).
              memory: 256Mi

      imagePullSecrets:
        - name: registry-credentials

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

---
apiVersion: v1
kind: Service
metadata:
  name: customer-site
  namespace: {{CUSTOMER_SLUG}}
  labels:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
